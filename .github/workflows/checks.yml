name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline regression, CLI, learning and safety checks
        run: /bin/bash tests/run.sh
      - name: Codex CLI adapter fixtures
        run: python3 tests/codex.py
      - name: Install confirmed-hook test dependency
        run: python3 -m pip install pytest
      - name: Confirmed-hook regression tests
        run: python3 -m pytest -q tests/test_install_confirmed_hooks.py tests/test_system_hook.py tests/test_session_packet.py tests/test_native_verifier.py tests/test_evidence.py tests/test_candidate_screen.py tests/test_benchmark.py tests/test_evidence_view.py tests/test_verification.py tests/test_shadow.py
      - name: Supervisor regression tests
        run: python3 -m unittest discover -s subprojects/supervisor/tests -v
      - name: Supervisor work-unit fixture tests
        run: python3 -m unittest discover -s subprojects/supervisor/benchmarks/work_units -p "test_*.py" -v
      - name: Public-file leak check
        run: python3 scripts/leak_check.py
