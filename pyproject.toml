[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "realstop"
dynamic = ["version"]
description = "Catches coding agents handing back work: a Claude Code Stop hook, its judge, and the realstop command."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []  # the CLI is stdlib only; the local model server sets up its own venv on first use
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: Software Development",
]
keywords = ["claude-code", "codex-cli", "coding-agents", "stop-hook", "decision-tune"]

[project.urls]
Homepage = "https://decisiontune.com/realstop/"
Repository = "https://github.com/decision-tune/realstop"
Model = "https://huggingface.co/decision-tune/realstop"
Changelog = "https://github.com/decision-tune/realstop/blob/main/CHANGELOG.md"
Issues = "https://github.com/decision-tune/realstop/issues"

[project.scripts]
realstop = "realstop.cli:main"

[tool.hatch.version]
path = "realstop/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["realstop"]

# the hooks, scripts, data and skill ship inside the wheel as realstop/_res (realstop/paths.py: res_root)
[tool.hatch.build.targets.wheel.force-include]
"hooks/codex-stop.py" = "realstop/_res/hooks/codex-stop.py"
"hooks/no-quit.py" = "realstop/_res/hooks/no-quit.py"
"hooks/correction.py" = "realstop/_res/hooks/correction.py"
"hooks/learn.py" = "realstop/_res/hooks/learn.py"
"scripts" = "realstop/_res/scripts"
"data/regression_pairs.jsonl" = "realstop/_res/data/regression_pairs.jsonl"
"skills/realstop/SKILL.md" = "realstop/_res/skills/realstop/SKILL.md"
"CHANGELOG.md" = "realstop/_res/CHANGELOG.md"

[tool.hatch.build.targets.sdist]
include = ["realstop", "hooks", "scripts", "data", "skills", "CHANGELOG.md", "README.md", "LICENSE", "pyproject.toml"]
